name: Update EPG

on:
  schedule:
    - cron: "17 */6 * * *"   # каждые 6 часов
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build epg.json
        run: python build_epg.py
      - name: Publish to branch "data" (single commit, history is not kept)
        run: |
          cd out
          git init -q -b data
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg.json
          git commit -q -m "EPG $(date -u +%F\ %H:%M)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
